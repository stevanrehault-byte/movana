# /etc/nginx/sites-available/movana
# Movana Platform - Nginx Configuration

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream definitions
upstream web_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream dashboard_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream api_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream rider_upstream {
    server 127.0.0.1:3002;
    keepalive 64;
}

upstream operator_sites_upstream {
    server 127.0.0.1:3003;
    keepalive 64;
}

# ═══════════════════════════════════════════════════════════════
# MAIN SITE — movana.bike
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name movana.bike www.movana.bike;

    # Cloudflare handles SSL, but we can also handle direct connections
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name movana.bike www.movana.bike;

    # SSL Configuration (Cloudflare Origin Certificate or Let's Encrypt)
    ssl_certificate /etc/ssl/movana/origin.pem;
    ssl_certificate_key /etc/ssl/movana/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Rate limiting
    limit_req zone=general_limit burst=50 nodelay;

    # Static files (uploads)
    location /uploads/ {
        alias /var/www/movana/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static files
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Main app
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

