# ═══════════════════════════════════════════════════════════════
# API — api.movana.bike
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name api.movana.bike;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.movana.bike;

    ssl_certificate /etc/ssl/movana/origin.pem;
    ssl_certificate_key /etc/ssl/movana/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # CORS headers (handled by API but backup here)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # Security
    add_header X-Content-Type-Options "nosniff" always;

    # Rate limiting (stricter for API)
    limit_req zone=api_limit burst=20 nodelay;

    # File upload size
    client_max_body_size 50M;

    location / {
        # Handle preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Webhooks (longer timeout)
    location /webhooks/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ═══════════════════════════════════════════════════════════════
# RIDER PWA — rider.movana.bike
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name rider.movana.bike;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rider.movana.bike;

    ssl_certificate /etc/ssl/movana/origin.pem;
    ssl_certificate_key /etc/ssl/movana/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # PWA manifest and service worker
    location /manifest.json {
        proxy_pass http://rider_upstream;
        add_header Cache-Control "no-cache";
    }

    location /sw.js {
        proxy_pass http://rider_upstream;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location /_next/static/ {
        proxy_pass http://rider_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://rider_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ═══════════════════════════════════════════════════════════════
# OPERATOR SITES — *.movana.bike (wildcard)
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name *.movana.bike;
    
    # Exclude known subdomains
    if ($host ~* ^(www|app|api|rider|blog)\.movana\.bike$) {
        return 444;
    }
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.movana.bike;

    # Exclude known subdomains
    if ($host ~* ^(www|app|api|rider|blog)\.movana\.bike$) {
        return 444;
    }

    ssl_certificate /etc/ssl/movana/origin.pem;
    ssl_certificate_key /etc/ssl/movana/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Extract subdomain and pass to app
    set $subdomain "";
    if ($host ~* ^([^.]+)\.movana\.bike$) {
        set $subdomain $1;
    }

    location /_next/static/ {
        proxy_pass http://operator_sites_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://operator_sites_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_cache_bypass $http_upgrade;
    }
}

